name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  bun-checks:
    name: Bun checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test (short)
        run: bun run test

      - name: Test (long, includes live Linear contract)
        env:
          # Live-arm contract test for `LinearSdkService` reads these. When
          # absent, the contract suite returns `undefined` from its factory
          # and skips the live arm cleanly — so this job is safe to run
          # without the secrets configured.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: ${{ secrets.LINEAR_TEAM_KEY }}
        run: bun run ftest

  nix-build:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build flake
        run: nix build . --print-build-logs

      - name: Smoke test the binary
        run: ./result/bin/tide --version
